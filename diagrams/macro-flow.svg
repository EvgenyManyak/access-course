<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Порядок выполнения действий макроса AutoExec (модуль 11)</title>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6a7a"/>
    </marker>
    <style>
      .act { fill: #ffffff; stroke: #a4373a; stroke-width: 1.6; }
      .acthead { fill: #a4373a; }
      .cond { fill: #fff8ec; stroke: #b45309; stroke-width: 1.6; }
      .flow { stroke: #5c6a7a; stroke-width: 2; fill: none; marker-end: url(#arr3); }
      .flowd { stroke: #5c6a7a; stroke-width: 2; fill: none; stroke-dasharray: 4 4; marker-end: url(#arr3); }
      .headtxt { fill: #ffffff; font-weight: 700; font-size: 13px; }
      .actname { fill: #a4373a; font-weight: 700; font-size: 13px; }
      .arg { fill: #1e2630; font-size: 12px; }
      .bg { fill: #f7f9fc; }
      .lbl { fill: #5c6a7a; font-size: 12px; font-weight: 700; }
      .note { fill: #ffffff; stroke: #d9e1ea; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="760" rx="12"/>

  <text x="30" y="40" font-weight="700" font-size="16" fill="#1e2630">Макрос AutoExec: порядок выполнения действий (модуль 11)</text>
  <text x="30" y="62" fill="#5c6a7a" font-size="12.5" font-style="italic">Конструктор макросов, «Каталог действий»; блок «Если» — из группы «Поток программ»; запуск — при открытии базы</text>

  <!-- 0. Событие: открытие базы -->
  <g transform="translate(90,100)">
    <rect class="act" width="420" height="86" rx="10"/>
    <rect class="acthead" width="420" height="30" rx="10"/>
    <rect class="acthead" y="15" width="420" height="15"/>
    <text class="headtxt" x="14" y="20">СОБЫТИЕ: открытие базы ShopData</text>
    <text class="arg" x="14" y="52">имя макроса — AutoExec: Access запускает его сам</text>
    <text class="arg" x="14" y="72">открытие с зажатым Shift — макрос не выполняется</text>
  </g>

  <!-- 1. OpenForm -->
  <g transform="translate(90,220)">
    <rect class="act" width="420" height="86" rx="10"/>
    <rect class="acthead" width="420" height="30" rx="10"/>
    <rect class="acthead" y="15" width="420" height="15"/>
    <text class="headtxt" x="14" y="20">1. OpenForm</text>
    <text class="arg" x="14" y="52">Имя формы: frm_Товары</text>
    <text class="arg" x="14" y="72">Режим данных: Изменение · Режим окна: Обычное</text>
  </g>

  <!-- 2. ОкноСообщения -->
  <g transform="translate(90,340)">
    <rect class="act" width="420" height="86" rx="10"/>
    <rect class="acthead" width="420" height="30" rx="10"/>
    <rect class="acthead" y="15" width="420" height="15"/>
    <text class="headtxt" x="14" y="20">2. ОкноСообщения</text>
    <text class="arg" x="14" y="52">Сообщение: «База ShopData открыта. Хорошей работы!»</text>
    <text class="arg" x="14" y="72">Сигнал: Да · Тип: Информационное · Заголовок: ShopData</text>
  </g>

  <!-- 3. Условие Если -->
  <g transform="translate(90,478)">
    <polygon class="cond" points="210,0 420,52 210,104 0,52"/>
    <text class="actname" x="210" y="44" text-anchor="middle" fill="#b45309">3. Если Weekday(Date())=2</text>
    <text class="arg" x="210" y="66" text-anchor="middle">истинно по понедельникам (Weekday: вс = 1)</text>
  </g>

  <!-- 4. ОкноСообщения внутри «Если» -->
  <g transform="translate(90,620)">
    <rect class="act" width="420" height="86" rx="10"/>
    <rect class="acthead" width="420" height="30" rx="10"/>
    <rect class="acthead" y="15" width="420" height="15"/>
    <text class="headtxt" x="14" y="20">4. ОкноСообщения — вложено в блок «Если»</text>
    <text class="arg" x="14" y="52">Сообщение: «Понедельник: планёрка по продажам в 10:00»</text>
    <text class="arg" x="14" y="72">Сигнал: Да · Тип: Информационное</text>
  </g>

  <!-- Стрелки основного потока -->
  <path class="flow" d="M300,186 L300,220"/>
  <path class="flow" d="M300,306 L300,340"/>
  <path class="flow" d="M300,426 L300,478"/>
  <path class="flow" d="M300,582 L300,620"/>

  <text class="lbl" x="308" y="604">Да</text>

  <!-- Ветка «Иначе» -->
  <path class="flowd" d="M510,530 L610,530"/>
  <text class="lbl" x="520" y="518">Иначе</text>
  <g transform="translate(620,480)">
    <rect class="note" width="250" height="100" rx="10"/>
    <text class="lbl" x="14" y="26">Условие ложно</text>
    <text class="arg" x="14" y="50">вложенное ОкноСообщения</text>
    <text class="arg" x="14" y="70">пропускается — макрос завершается,</text>
    <text class="arg" x="14" y="88">форма и приветствие уже показаны</text>
  </g>

  <!-- Замечания -->
  <g transform="translate(600,100)">
    <rect class="note" width="270" height="200" rx="10"/>
    <text class="actname" x="14" y="26">Заметки</text>
    <text class="arg" x="14" y="52">• Порядок важен: действия</text>
    <text class="arg" x="14" y="72">выполняются сверху вниз,</text>
    <text class="arg" x="14" y="92">одно за другим.</text>
    <text class="arg" x="14" y="120">• «Если» ложно — вложенное</text>
    <text class="arg" x="14" y="140">действие пропускается целиком.</text>
    <text class="arg" x="14" y="168">• Shift отменяет AutoExec —</text>
    <text class="arg" x="14" y="188">заход «под капот» разработчика.</text>
  </g>
</svg>
